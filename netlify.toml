[build]
  command = "zip -s 0 fwp-netlify.zip --out fwp-source.zip && unzip -q fwp-source.zip -d site && cd site && npm install && npm run build"
  publish = "site/dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  directory = "site/netlify/functions"

[functions."process-payment-emails"]
  schedule = "*/15 * * * *"

[functions."send-confirmation-preview"]
  schedule = "@yearly"
